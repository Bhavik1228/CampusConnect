name: Curriculum document processing

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: curriculum-document-processing
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/scripts/requirements-curriculum.txt
      - name: Install document and OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr antiword
          python -m pip install -r app/scripts/requirements-curriculum.txt
      - name: Process a bounded batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CURRICULUM_FAILED_RETENTION_DAYS: "14"
        run: python app/scripts/curriculum_worker.py
